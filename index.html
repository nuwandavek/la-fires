<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" integrity="sha512-vc58qvvBdrDR4etbxMdlTt4GBQk1qjvyORR2nrsPsFPyrs+/u5c3+1Ct6upOgdZoIl7eq6k3a1UPDSNAQi/32A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.css">
    <script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.js"></script>
    <link rel="stylesheet" type="text/css" href="./style.css">
  </head>
  <body>
    <div id="top-text">
      <p><span class="ui massive text">la fire</span></p>
      <p><span class="ui big text">SATELLITE + FLIGHT ADSB DATA
      </span></p>
    </div>
    <div id="slider-container">
      <p><span class="ui huge text" id="main-time"></span></p>
      <div id="slider-container2">
        <div class="ui slider inverted red labeled" id="slider-1"></div>
        <button class="ui labeled icon button" id="toggle-animation">
          <i class="pause icon"></i>
          Pause
        </button>
        <p class="satt">satellite flyover time</p>
      </div>
      <div>
        <div id="selected-cool-aircrafts"></div>
        <div id="cool-aircrafts"></div>
      <p style="margin-top: 10px;"><span class="ui big text italic" style="color: white">follow some cool aircrafts</span></p>
      <p style="margin-top: 10px;"><span class="ui normal text italic" style="color: white">data sources: <a href="https://firms.modaps.eosdis.nasa.gov/active_fire/#firms-txt">NASA</a> and <a href="https://globe.adsbexchange.com/">ADSB Exchange</a></span></p>
      <p style="margin-top: 10px;"><span class="ui normal text italic" style="color: white">made with ❤️ by vivek</span></p>
      </div>
    </div>
    <div id="deck-canvas" style="flex: 1;"></div>
    <script src="./index.js"></script>
  </body>
</html>
